# Native Linux VM Nginx Configuration for DYPIU Portal
# Place this file in /etc/nginx/sites-available/dypiu-portal
# Enable it with: sudo ln -s /etc/nginx/sites-available/dypiu-portal /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name portal.dypiu.ac.in _ ; # Replace with your domain name or server IP

    root /var/www/dypiu-portal/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Caching Static Assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # SPA Fallback Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: SSL Configuration (Uncomment after running certbot)
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/portal.dypiu.ac.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/portal.dypiu.ac.in/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
